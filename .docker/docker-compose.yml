services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: millionaire
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: millionaire
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ../backend
      dockerfile: ../.docker/Dockerfile.backend
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../.docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: